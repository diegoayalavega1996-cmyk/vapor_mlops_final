name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: streamlit-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Actualizar la rama de Streamlit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: 1. Descargar el código validado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: 2. Comprobar que main conserva esta versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$SOURCE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Una versión posterior de main está pendiente de validación."
          fi
      - name: 3. Recuperar el modelo de la misma ejecución de CI
        if: steps.version.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: modelo-vapor
          path: ${{ runner.temp }}/modelo-vapor
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: 4. Publicar código y modelo en deploy
        if: steps.version.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/vapor-deploy"
          mkdir -p "$bundle/models"
          git archive "$SOURCE_SHA" | tar -x -C "$bundle"
          rm -rf "$bundle/.github"
          cp "$RUNNER_TEMP/modelo-vapor/"* "$bundle/models/"
          test -s "$bundle/models/vapor_model.joblib"
          test -s "$bundle/models/metrics.json"
          test -s "$bundle/models/test_predictions.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/deploy; then
            git switch -C deploy origin/deploy
          else
            git switch --orphan deploy
          fi
          git rm -rf --ignore-unmatch .
          rsync -a "$bundle/" ./
          git add --all
          git add --force models/vapor_model.joblib models/metrics.json models/test_predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Deploy modelo validado $SOURCE_SHA"
            git push origin HEAD:deploy
          fi
